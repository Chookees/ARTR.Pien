name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Requires Code scanning enabled in the repo:
    # Settings → Code security → Code scanning → Set up (or enable default setup / advanced).
    # Public repos: free. Private repos: needs GitHub Advanced Security.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install the SDK before CodeQL init so the tracer can wrap the toolchain.
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.302"

      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          languages: csharp
          build-mode: manual

      - name: Build (traced by CodeQL)
        run: |
          dotnet restore ARTR.Pien.sln --locked-mode
          dotnet build ARTR.Pien.sln -c Release --no-restore /p:UseSharedCompilation=false

      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          category: "/language:csharp"
