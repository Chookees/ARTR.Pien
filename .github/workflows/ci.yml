name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"
      - name: Restore
        run: dotnet restore ARTR.Pien.sln --locked-mode
      - name: Build
        run: dotnet build ARTR.Pien.sln -c Release --no-restore
      - name: Test
        run: dotnet test ARTR.Pien.sln -c Release --no-build --collect:"XPlat Code Coverage"
      - name: Smoke
        run: |
          dotnet run --project src/ARTR.Pien.Cli -c Release --no-build -- version
          dotnet run --project src/ARTR.Pien.Cli -c Release --no-build -- list-checks
