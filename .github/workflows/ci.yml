name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin must be a real commit on actions/setup-dotnet (v5.0.0).
      # Previous pin d4c94342e560b879... was a typo and does not exist.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore ARTR.Pien.sln --locked-mode
      - name: Format
        run: dotnet format ARTR.Pien.sln --verify-no-changes
      - name: Build
        run: dotnet build ARTR.Pien.sln -c Release --no-restore
      - name: Test with coverage gate
        run: pwsh -File build/Test.ps1 -Configuration Release
      - name: Smoke
        run: |
          dotnet run --project src/ARTR.Pien.Cli -c Release --no-build -- version
          dotnet run --project src/ARTR.Pien.Cli -c Release --no-build -- doctor
          dotnet run --project src/ARTR.Pien.Cli -c Release --no-build -- list-checks
          dotnet run --project src/ARTR.Pien.Cli -c Release --no-build -- explain PIEN-HTTP-001
