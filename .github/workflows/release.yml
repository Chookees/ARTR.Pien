name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"
      - run: dotnet build ARTR.Pien.sln -c Release
      - run: bash build/Publish.sh Release
      - run: bash build/PackageSource.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/publish/**
            artifacts/ARTR.Pien-source.zip
            artifacts/ARTR.Pien-source.zip.sha256
            artifacts/ARTR.Pien-source.manifest.txt
