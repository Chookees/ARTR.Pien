name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.302"
      - run: dotnet build ARTR.Pien.sln -c Release
      - run: bash build/Publish.sh Release
      - run: bash build/PackageSource.sh
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/publish/**
            artifacts/ARTR.Pien-source.zip
            artifacts/ARTR.Pien-source.zip.sha256
            artifacts/ARTR.Pien-source.manifest.txt
